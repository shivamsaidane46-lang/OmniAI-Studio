backend:
  name: git-gateway
  branch: main

site_url: https://omniaistudio.in
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Category, name: category, widget: string }
      - { label: Status, name: status, widget: select, options: [draft, published], default: published }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Technologies, name: technologies, widget: list, default: [] }
      - { label: Demo Video URL, name: demoVideo, widget: string, required: false }
      - { label: Live Demo URL, name: liveDemo, widget: string, required: false }
      - { label: GitHub URL, name: github, widget: string, required: false }
      - { label: Cover Image, name: coverImage, widget: image, required: false }
      - { label: Project Content, name: body, widget: markdown }

  - name: site
    label: Site Settings
    files:
      - label: General
        name: general
        file: src/content/site/general.md
        fields:
          - { label: Business Name, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Instagram, name: instagram, widget: string, required: false }
          - { label: LinkedIn, name: linkedin, widget: string, required: false }
          - { label: Slack, name: slack, widget: string, required: false }
          - { label: GitHub, name: github, widget: string, required: false }
