<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">OmniAI Studio</title>
  <desc id="desc">Minimal OmniAI Studio wordmark with an interlocking AI symbol in cyan, blue and silver.</desc>
  <defs>
    <linearGradient id="ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18dcff"/><stop offset="55%" stop-color="#2388ff"/><stop offset="100%" stop-color="#7357ff"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#d6dbe2"/><stop offset="100%" stop-color="#8993a2"/>
