<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#0b0b0f"/>
<defs>
  <linearGradient id="red" x1="0" x2="1"><stop stop-color="#3a0f15"/><stop offset="1" stop-color="#5a171c"/></linearGradient>
  <linearGradient id="green" x1="0" x2="1"><stop stop-color="#06391e"/><stop offset="1" stop-color="#064c28"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#163f9d"/><stop offset="1" stop-color="#1d4db8"/></linearGradient>
  <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#2b0c68"/><stop offset="1" stop-color="#351083"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
  <style>
    .group{stroke-width:2;rx:16}
    .groupTitle{font-family:Inter,Arial,sans-serif;font-size:22px;font-weight:800;fill:#fff}
    .node{fill:#17171e;stroke:#77778a;stroke-width:2;rx:10}
    .label{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:700;fill:#fff;text-anchor:middle}
    .sub{font-family:Inter,Arial,sans-serif;font-size:12px;fill:#aaaabd;text-anchor:middle}
    .conn{stroke:#8b5cf6;stroke-width:3;fill:none;stroke-linecap:round}
    .dash{stroke:#8b5cf6;stroke-width:2.5;stroke-dasharray:8 8;fill:none;stroke-linecap:round}
    .section{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:800;fill:#c4b5fd;letter-spacing:1px}
  </style>
</defs>

<text x="50" y="55" class="section">DAY 02 / 30 · LEAD AUTOMATION</text>
<text x="50" y="92" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="800" fill="#f5f3ff">Lead Capture, AI Scoring &amp; Routing Engine</text>
<text x="50" y="120" font-family="Inter,Arial,sans-serif" font-size="15" fill="#a1a1aa">Capture → Enrich → Score → Route → Follow Up</text>

<!-- CAPTURE -->
<rect x="50" y="175" width="250" height="260" fill="url(#red)" stroke="#b91c1c" class="group" filter="url(#shadow)"/>
<text x="75" y="210" class="groupTitle">LEAD CAPTURE</text>
<rect x="75" y="245" width="200" height="65" class="node"/>
<text x="175" y="272" class="label">On Form Submission</text><text x="175" y="293" class="sub">name · email · company</text>
<rect x="75" y="335" width="200" height="65" class="node"/>
<text x="175" y="362" class="label">Company URL Researcher</text><text x="175" y="383" class="sub">public enrichment</text>

<!-- SCORING -->
<rect x="340" y="175" width="300" height="260" fill="url(#green)" stroke="#16a34a" class="group" filter="url(#shadow)"/>
<text x="365" y="210" class="groupTitle">AI SCORING</text>
<rect x="365" y="245" width="250" height="65" class="node"/>
<text x="490" y="272" class="label">AI Lead Scorer</text><text x="490" y="293" class="sub">score + qualification</text>
<rect x="365" y="335" width="250" height="65" class="node"/>
<text x="490" y="362" class="label">Route Lead by Score</text><text x="490" y="383" class="sub">hot · medium · cold</text>

<!-- ROUTING -->
<rect x="680" y="175" width="850" height="260" fill="#15151b" stroke="#3f3f4d" class="group" filter="url(#shadow)"/>
<text x="705" y="210" class="groupTitle">LEAD ROUTING</text>

<rect x="705" y="245" width="245" height="145" fill="url(#blue)" class="group"/>
<text x="725" y="275" class="groupTitle" font-size="18">HOT · 75+</text>
<rect x="720" y="295" width="100" height="45" class="node"/><text x="770" y="314" class="label" font-size="13">Gmail</text><text x="770" y="331" class="sub">follow-up</text>
<rect x="830" y="295" width="100" height="45" class="node"/><text x="880" y="314" class="label" font-size="13">Sheets</text><text x="880" y="331" class="sub">CRM</text>

<rect x="970" y="245" width="245" height="145" fill="#25252b" class="group"/>
<text x="990" y="275" class="groupTitle" font-size="18">MEDIUM · 25–74</text>
<rect x="985" y="295" width="100" height="45" class="node"/><text x="1035" y="314" class="label" font-size="13">Gmail</text><text x="1035" y="331" class="sub">follow-up</text>
<rect x="1095" y="295" width="100" height="45" class="node"/><text x="1145" y="314" class="label" font-size="13">Sheets</text><text x="1145" y="331" class="sub">CRM</text>

<rect x="1235" y="245" width="270" height="145" fill="#202024" class="group"/>
<text x="1255" y="275" class="groupTitle" font-size="18">COLD · &lt;25</text>
<rect x="1270" y="320" width="190" height="50" class="node"/><text x="1365" y="341" class="label" font-size="13">Google Sheets</text><text x="1365" y="358" class="sub">nurture / CRM</text>

<!-- INFRASTRUCTURE -->
<rect x="50" y="500" width="680" height="300" fill="url(#purple)" stroke="#7c3aed" class="group" filter="url(#shadow)"/>
<text x="75" y="540" class="groupTitle">AI MODELS &amp; KNOWLEDGE BASE</text>

<rect x="75" y="575" width="180" height="65" class="node"/>
<text x="165" y="602" class="label">OpenRouter Chat Model</text><text x="165" y="623" class="sub">AI model</text>
<rect x="275" y="575" width="180" height="65" class="node"/>
<text x="365" y="602" class="label">Google Gemini</text><text x="365" y="623" class="sub">embeddings</text>
<rect x="475" y="575" width="180" height="65" class="node"/>
<text x="565" y="602" class="label">Pinecone Vector Store</text><text x="565" y="623" class="sub">qualification rules</text>

<rect x="75" y="680" width="150" height="60" class="node"/>
<text x="150" y="705" class="label">Google Drive</text><text x="150" y="723" class="sub">knowledge source</text>
<rect x="245" y="680" width="150" height="60" class="node"/>
<text x="320" y="705" class="label">Download File</text><text x="320" y="723" class="sub">document</text>
<rect x="415" y="680" width="150" height="60" class="node"/>
<text x="490" y="705" class="label">Data Loader</text><text x="490" y="723" class="sub">documents</text>
<rect x="585" y="680" width="120" height="60" class="node"/>
<text x="645" y="705" class="label">Text Splitter</text><text x="645" y="723" class="sub">chunks</text>

<!-- CONNECTIONS -->
<path d="M300 305H340" class="conn"/>
<path d="M640 305H680" class="conn"/>
<path d="M300 365H340" class="conn"/>
<path d="M640 365H680" class="conn"/>
<path d="M255 607H275" class="dash"/>
<path d="M455 607H475" class="dash"/>
<path d="M225 710H245M395 710H415M565 710H585" class="dash"/>
<path d="M490 435V575H165" class="dash"/>
<path d="M490 435V575H365" class="dash"/>
<path d="M570 435V575H565" class="dash"/>
<path d="M490 435V680H150" class="dash"/>

<text x="50" y="850" font-family="Inter,Arial,sans-serif" font-size="13" fill="#71717a">Portfolio architecture view · Public diagram only · Credentials and private account bindings excluded</text>
</svg>