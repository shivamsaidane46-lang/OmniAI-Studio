<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect width="1920" height="1080" fill="#0b0b0f"/>
  <defs>
    <linearGradient id="red" x1="0" x2="1"><stop stop-color="#3a0f15"/><stop offset="1" stop-color="#5a171c"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#06391e"/><stop offset="1" stop-color="#064c28"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#163f9d"/><stop offset="1" stop-color="#1d4db8"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#2b0c68"/><stop offset="1" stop-color="#351083"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
    <style>
      .panel{stroke:#262632;stroke-width:2;rx:10}
      .title{font-family:Inter,Arial,sans-serif;font-weight:700;fill:#fff}
      .body{font-family:Inter,Arial,sans-serif;font-size:19px;fill:#e6e6ea}
      .small{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#b9b9c7}
      .node{fill:#17171e;stroke:#68687a;stroke-width:2;rx:8}
      .label{font-family:Inter,Arial,sans-serif;font-size:17px;font-weight:700;fill:#fff;text-anchor:middle}
      .sub{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#aaaabd;text-anchor:middle}
      .conn{stroke:#6a6a77;stroke-width:3;fill:none}
      .dashed{stroke:#8d67ff;stroke-width:2.5;stroke-dasharray:8 8;fill:none}
    </style>
  </defs>
  <rect x="230" y="165" width="390" height="220" fill="url(#red)" class="panel" filter="url(#shadow)"/>
  <text x="255" y="205" class="title" font-size="24">Lead Capture &amp; Enrichment</text>
  <text x="255" y="238" class="body">This first step instantly captures information from</text>
  <text x="255" y="263" class="body">the website contact form. The system then</text>
  <text x="255" y="288" class="body">automatically finds more public details about the</text>
  <text x="255" y="313" class="body">lead's company, giving us a complete and accurate</text>
  <text x="255" y="338" class="body">profile to analyze.</text>
  <rect x="285" y="292" width="125" height="65" class="node"/>
  <circle cx="310" cy="315" r="10" fill="#4bc2a8"/><text x="310" y="346" class="sub">On form submission</text>
  <rect x="455" y="292" width="135" height="65" class="node"/>
  <circle cx="482" cy="315" r="10" fill="#62a4ff"/><text x="522" y="319" class="label" font-size="13">Company URL</text><text x="522" y="341" class="sub">Researcher</text>
  <path d="M410 324H455" class="conn"/>
  <text x="515" y="378" class="small">POST: https://httpbin.org/post</text>
  <rect x="695" y="165" width="410" height="220" fill="url(#green)" class="panel" filter="url(#shadow)"/>
  <text x="720" y="205" class="title" font-size="24">AI Scoring &amp; Qualification</text>
  <text x="720" y="238" class="body">Here, our AI analyzes the complete lead profile. It instantly retrieves</text>
  <text x="720" y="263" class="body">our most up-to-date scoring criteria from the Pinecone database and</text>
  <text x="720" y="288" class="body">uses those rules to assign an accurate score from 1-100.</text>
  <rect x="725" y="292" width="150" height="65" class="node"/>
  <text x="800" y="319" class="label">AI Lead Scorer</text><text x="800" y="342" class="sub">Chat Model</text>
  <rect x="900" y="292" width="150" height="65" class="node"/>
  <text x="975" y="319" class="label">Route Lead by</text><text x="975" y="342" class="sub">Score</text>
  <path d="M875 324H900" class="conn"/>
  <path d="M590 324H725" class="conn"/>
  <rect x="1135" y="160" width="430" height="250" fill="url(#blue)" class="panel" filter="url(#shadow)"/>
  <text x="1160" y="200" class="title" font-size="22">Hot Leads (Score 75+): Immediate Action</text>
  <text x="1160" y="230" class="body">The best leads are fast-tracked. A deal is instantly created in the CRM,</text>
  <text x="1160" y="254" class="body">a follow-up email is sent, and the sales team gets an immediate alert.</text>
  <rect x="1170" y="290" width="110" height="65" class="node"/><text x="1225" y="317" class="label">Quick Follow Up</text><text x="1225" y="340" class="sub">send: message</text>
  <rect x="1325" y="290" width="110" height="65" class="node"/><text x="1380" y="317" class="label">HOT Lead CRM</text><text x="1380" y="340" class="sub">append: sheet</text>
  <rect x="1480" y="290" width="70" height="65" class="node"/><text x="1515" y="317" class="label">Slack</text><text x="1515" y="340" class="sub">alert</text>
  <path d="M1280 322H1325M1435 322H1480" class="conn"/>
  <path d="M1050 324C1080 324 1090 300 1135 300" class="conn"/>
  <rect x="1135" y="430" width="430" height="250" fill="#17171b" class="panel" filter="url(#shadow)"/>
  <text x="1160" y="470" class="title" font-size="22">Medium Leads (Score 25-74): Sales Team Review</text>
  <text x="1160" y="500" class="body">Promising leads are sent directly to the sales team. The system creates</text>
  <text x="1160" y="524" class="body">a record in the CRM and assigns it for personal review and follow-up.</text>
  <rect x="1170" y="565" width="110" height="65" class="node"/><text x="1225" y="592" class="label">Quick Follow Up</text><text x="1225" y="615" class="sub">send: message</text>
  <rect x="1325" y="565" width="110" height="65" class="node"/><text x="1380" y="592" class="label">Medium CRM</text><text x="1380" y="615" class="sub">append: sheet</text>
  <rect x="1480" y="565" width="70" height="65" class="node"/><text x="1515" y="592" class="label">Gmail</text><text x="1515" y="615" class="sub">sales team</text>
  <path d="M1280 597H1325M1435 597H1480" class="conn"/>
  <path d="M1050 340C1085 380 1090 460 1135 470" class="conn"/>
  <rect x="1135" y="715" width="430" height="145" fill="#1a1a1e" class="panel"/>
  <text x="1160" y="755" class="title" font-size="22">Cold Leads (Score &lt;25)</text>
  <rect x="1190" y="780" width="130" height="60" class="node"/><text x="1255" y="805" class="label">Cold Lead CRM</text><text x="1255" y="827" class="sub">append: sheet</text>
  <path d="M1050 350C1090 470 1080 785 1190 810" class="conn"/>
  <rect x="600" y="430" width="330" height="150" fill="url(#purple)" class="panel" filter="url(#shadow)"/>
  <text x="625" y="465" class="title" font-size="22">AI Models</text>
  <circle cx="680" cy="510" r="25" fill="#23232d" stroke="#777" stroke-width="2"/><text x="680" y="548" class="sub">OpenRouter Chat</text><text x="680" y="565" class="sub">Model</text>
  <circle cx="810" cy="510" r="25" fill="#23232d" stroke="#777" stroke-width="2"/><text x="810" y="548" class="sub">Google Gemini</text><text x="810" y="565" class="sub">Embeddings</text>
  <path d="M800 357C760 405 720 430 680 485M875 357C850 405 825 445 810 485" class="dashed"/>
  <rect x="955" y="430" width="270" height="150" fill="url(#purple)" class="panel" filter="url(#shadow)"/>
  <text x="980" y="465" class="title" font-size="22">Database</text>
  <rect x="1000" y="495" width="180" height="60" class="node"/>
  <text x="1090" y="521" class="label">Pinecone Vector</text><text x="1090" y="543" class="sub">Store</text>
  <text x="1065" y="478" class="small">3072 items</text>
  <path d="M1000 525C960 500 930 430 900 357" class="dashed"/>
  <rect x="300" y="640" width="650" height="300" fill="url(#purple)" class="panel" filter="url(#shadow)"/>
  <text x="325" y="680" class="title" font-size="22">System Knowledgebase</text>
  <text x="325" y="710" class="body">This is the AI's central “rulebook.” We use it to upload and manage the specific</text>
  <text x="325" y="735" class="body">criteria for what defines an ideal lead. This ensures the AI always scores</text>
  <text x="325" y="760" class="body">with perfect consistency based on our latest business rules.</text>
  <rect x="340" y="805" width="120" height="65" class="node"/><text x="400" y="832" class="label">Google Drive</text><text x="400" y="854" class="sub">Trigger</text>
  <rect x="500" y="805" width="120" height="65" class="node"/><text x="560" y="832" class="label">Download file</text><text x="560" y="854" class="sub">drive</text>
  <rect x="660" y="795" width="200" height="80" class="node"/><text x="760" y="826" class="label">Pinecone Vector</text><text x="760" y="848" class="sub">Store</text>
  <path d="M460 837H500M620 837H660" class="conn"/>
  <circle cx="440" cy="900" r="25" fill="#23232d" stroke="#777" stroke-width="2"/><text x="440" y="940" class="sub">Gemini Embeddings</text>
  <circle cx="600" cy="900" r="25" fill="#23232d" stroke="#777" stroke-width="2"/><text x="600" y="940" class="sub">Character Text</text><text x="600" y="957" class="sub">Splitter</text>
  <rect x="705" y="890" width="145" height="60" class="node"/><text x="778" y="916" class="label">Default Data</text><text x="778" y="938" class="sub">Loader</text>
  <path d="M440 875C480 850 540 850 660 835M600 875C650 850 700 850 705 920" class="dashed"/>
  <text x="1080" y="305" class="small">Hot</text>
  <text x="1080" y="440" class="small">Medium</text>
  <text x="1080" y="755" class="small">Cold</text>
</svg>