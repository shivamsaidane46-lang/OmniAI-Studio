<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0b12"/><stop offset="1" stop-color="#14101f"/></linearGradient><linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b1828"/><stop offset="1" stop-color="#242035"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b5cf6"/></marker></defs><rect width="1600" height="900" fill="url(#bg)"/><text x="80" y="90" fill="#a78bfa" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">DAY 1 / 30 · AI INVOICE EXTRACTOR</text><text x="80" y="135" fill="#f5f5f7" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800">PDF Invoice → Structured, Validated Data</text><text x="80" y="175" fill="#a1a1aa" font-family="Inter,Arial,sans-serif" font-size="19">Webhook-driven n8n pipeline using AI extraction, validation logic and Google Sheets.</text><g filter="url(#shadow)"><rect x="70" y="260" width="220" height="120" rx="18" fill="url(#node)" stroke="#3b3552" stroke-width="2"/><circle cx="100" cy="290" r="15" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6"/><text x="100" y="295" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial" font-size="12" font-weight="700">01</text><text x="94" y="332" fill="#f4f4f5" font-family="Inter,Arial" font-size="18" font-weight="700">Webhook Trigger</text><text x="94" y="358" fill="#a1a1aa" font-family="Inter,Arial" font-size="13">POST /invoice-upload</text><rect x="330" y="260" width="220" height="120" rx="18" fill="url(#node)" stroke="#3b3552" stroke-width="2"/><circle cx="360" cy="290" r="15" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6"/><text x="360" y="295" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial" font-size="12" font-weight="700">02</text><text x="354" y="332" fill="#f4f4f5" font-family="Inter,Arial" font-size="18" font-weight="700">Extract Text from PDF</text><text x="354" y="358" fill="#a1a1aa" font-family="Inter,Arial" font-size="13">PDF text extraction</text><rect x="590" y="260" width="220" height="120" rx="18" fill="url(#node)" stroke="#3b3552" stroke-width="2"/><circle cx="620" cy="290" r="15" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6"/><text x="620" y="295" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial" font-size="12" font-weight="700">03</text><text x="614" y="332" fill="#f4f4f5" font-family="Inter,Arial" font-size="18" font-weight="700">Build Prompt</text><text x="614" y="358" fill="#a1a1aa" font-family="Inter,Arial" font-size="13">Structured extraction schema</text><rect x="850" y="260" width="220" height="120" rx="18" fill="url(#node)" stroke="#3b3552" stroke-width="2"/><circle cx="880" cy="290" r="15" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6"/><text x="880" y="295" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial" font-size="12" font-weight="700">04</text><text x="874" y="332" fill="#f4f4f5" font-family="Inter,Arial" font-size="18" font-weight="700">Basic LLM Chain</text><text x="874" y="358" fill="#a1a1aa" font-family="Inter,Arial" font-size="13">OpenRouter · AI extraction</text><rect x="1110" y="260" width="220" height="120" rx="18" fill="url(#node)" stroke="#3b3552" stroke-width="2"/><circle cx="1140" cy="290" r="15" fill="#8b5cf6" fill-opacity=".18" stroke="#8b5cf6"/><text x="1140" y="295" text-anchor="middle" fill="#c4b5fd" font-family="Inter,Arial" font-size="12" font-weight="700">05</text><text x="1134" y="332" fill="#f4f4f5" font-family="Inter,Arial" font-size="18" font-weight="700">Clean &amp; Validate</text><text x="1134" y="358" fill="#a1a1aa" font-family="Inter,Arial" font-size="13">Fields + arithmetic checks</text><path d="M290 320 H318" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M550 320 H578" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M810 320 H838" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1070 320 H1098" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1220 380 V500 H925 V575" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1330 320 V500 H1355 V575" stroke="#8b5cf6" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="760" y="575" width="330" height="125" rx="18" fill="url(#node)" stroke="#3b3552" stroke-width="2"/><text x="785" y="615" fill="#f4f4f5" font-family="Inter,Arial" font-size="19" font-weight="700">Valid → Google Sheets</text><text x="785" y="645" fill="#a1a1aa" font-family="Inter,Arial" font-size="13">Append invoice number, vendor, totals, dates</text><text x="785" y="675" fill="#86efac" font-family="Inter,Arial" font-size="13" font-weight="700">Success · HTTP 200</text><rect x="1190" y="575" width="330" height="125" rx="18" fill="url(#node)" stroke="#3b3552" stroke-width="2"/><text x="1215" y="615" fill="#f4f4f5" font-family="Inter,Arial" font-size="19" font-weight="700">Invalid → Review</text><text x="1215" y="645" fill="#a1a1aa" font-family="Inter,Arial" font-size="13">Returns validation errors + raw AI response</text><text x="1215" y="675" fill="#fbbf24" font-family="Inter,Arial" font-size="13" font-weight="700">Needs review · HTTP 422</text></g><text x="80" y="790" fill="#71717a" font-family="Inter,Arial" font-size="15">Checks include required fields, line-item quantity × unit price, subtotal reconciliation, and subtotal + tax = total.</text><text x="80" y="825" fill="#52525b" font-family="Inter,Arial" font-size="14">Designed for text-based PDF invoices; scanned/photographed invoices require a vision-capable extraction step.</text></svg>